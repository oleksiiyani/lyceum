<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Одеський ліцей №81 — Організація освітнього процесу 2026–2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>

:root{
  --cream:#F1EFE8;
  --cream-2:#E8E6DF;
  --cream-3:#DEDDD3;
  --black:#0F0F0F;
  --black-2:#1A1A1A;
  --grey-700:#3D3D3D;
  --grey-500:#7A7A7A;
  --grey-300:#CFCFCF;
  --grey-100:#F4F4F4;
  --white:#FFFFFF;
  --orange:#F89557;
  --orange-2:#FF8A4D;
  --orange-soft:#FFC1A1;
  --orange-pale:#FFE6D6;
  --peach:#F8DAC9;

  --text:var(--black);
  --muted:var(--grey-500);
  --bg:var(--cream);
  --card:#FFFFFF;
  --border:var(--cream-3);

  --error-bg:#FFE9E5; --error-bd:#D9412C; --error-tx:#9C2A1A;
  --why-bg:#EAE8E0;   --why-bd:#3D3D3D;   --why-tx:#1A1A1A;
  --how-bg:#FFEEDF;   --how-bd:var(--orange);  --how-tx:#A35418;
  --ex-bg:#F4F2EA;    --ex-bd:#7A7A7A;    --ex-tx:#3D3D3D;
  --tip-bg:#FFE6D6;   --tip-bd:var(--orange-2); --tip-tx:#8A3A0F;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;overflow-anchor:none}
html{scroll-behavior:smooth}
body{
  font-family:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  color:var(--text);
  background:var(--bg);
  line-height:1.6;
  font-size:16px;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-weight:800;letter-spacing:-.025em;margin:0}

/* topbar */
.topbar{
  position:sticky;top:0;z-index:50;
  background:rgba(241,239,232,.92);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  padding:14px 0;
}
.topbar-inner{max-width:1280px;margin:0 auto;padding:0 20px;}
.topbar-bar{
  display:flex;align-items:center;gap:18px;width:100%;flex-wrap:wrap;
  background:var(--white);
  border-radius:999px;
  padding:10px 10px 10px 18px;
  box-shadow:0 1px 0 rgba(15,15,15,.04), 0 8px 20px rgba(15,15,15,.03);
}
.mobile-progress{display:none;}
.logo{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--black)}
.logo .label{font-size:13.5px;color:var(--black);font-weight:800;letter-spacing:-.005em;line-height:1.2}
.logo .label small{display:block;font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;margin-top:2px;color:#B75A22}
.blocks-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.blocks-tabs button{
  display:inline-flex;align-items:center;gap:8px;
  padding:9px 16px;border-radius:999px;
  background:transparent;color:var(--black);
  font-size:13px;font-weight:700;text-decoration:none;
  border:1px solid transparent;
  transition:all .15s;
  cursor:pointer;
  font-family:inherit;
}
.blocks-tabs button:hover:not(:disabled):not(.on){background:var(--cream)}
.blocks-tabs button.on{background:var(--black);color:var(--white)}
.blocks-tabs button .dot{width:7px;height:7px;border-radius:99px;background:currentColor;opacity:.35;flex:0 0 auto}
.blocks-tabs button.on .dot{opacity:1;background:var(--orange)}
.blocks-tabs button:disabled{color:var(--grey-300);cursor:not-allowed}
.blocks-tabs button .soon{font-size:9.5px;font-weight:700;color:var(--grey-300);text-transform:uppercase;letter-spacing:.08em}

/* layout */
.shell{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:270px 1fr;gap:30px;padding:28px 20px 90px}
aside.side{
  position:sticky;top:88px;align-self:start;
  height:calc(100vh - 110px);overflow-y:auto;
  padding-bottom:20px;
}
@media (max-width:860px){
  .shell{grid-template-columns:1fr;}
  aside.side{position:static;height:auto;overflow-y:visible;top:auto;}
  .mobile-progress{
    display:flex;align-items:center;gap:10px;
    padding:0 2px;margin-top:8px;
  }
  .mobile-progress .label{
    font-size:10px;color:var(--muted);font-weight:800;
    letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;
  }
  .mobile-progress .pct{
    font-size:10px;color:var(--muted);font-weight:800;white-space:nowrap;
  }
  .mobile-progress .bar{
    flex:1 1 auto;height:6px;background:var(--cream-2);border-radius:99px;overflow:hidden;
  }
  .mobile-progress .fill{
    height:100%;background:var(--orange);border-radius:99px;transition:width .4s;
  }
}
@media (max-width:700px){
  .topbar-bar{
    border-radius:22px;
    flex-direction:column;
    align-items:flex-start;
    padding:14px 16px;
  }
  .blocks-tabs{margin-left:0;width:100%;}
  .blocks-tabs button{padding:8px 12px;font-size:12.5px;}
}
.side-title{font-size:11px;color:var(--muted);font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:0 10px 10px}
.side-list{display:flex;flex-direction:column;gap:3px;}
.side-item{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  border:none;background:transparent;text-align:left;
  padding:10px 12px;border-radius:12px;
  font-size:13.5px;font-weight:700;color:var(--black);
  cursor:pointer;font-family:inherit;
}
.side-item:hover:not(:disabled):not(.on){background:var(--white)}
.side-item.on{background:var(--black);color:var(--white)}
.side-item:disabled{color:var(--grey-300);cursor:not-allowed}
.side-item .soon{font-size:9px;font-weight:700;color:var(--grey-300);text-transform:uppercase;letter-spacing:.06em}
.side-item.on .soon{color:#8a8a8a}

.progress-card{
  margin-top:16px;padding:16px 18px;
  background:var(--white);border-radius:16px;
}
.progress-card .label{
  font-size:10.5px;color:var(--muted);font-weight:800;
  display:flex;justify-content:space-between;margin-bottom:9px;
  letter-spacing:.08em;text-transform:uppercase;
}
.progress-card .bar{height:7px;background:var(--cream);border-radius:99px;overflow:hidden}
.progress-card .fill{height:100%;background:var(--orange);border-radius:99px;transition:width .4s}

/* main */
main.content{min-width:0}

.module-banner{
  background:var(--black);color:var(--white);
  padding:30px 32px;border-radius:24px;
  position:relative;overflow:hidden;
  margin-bottom:28px;
}
.module-banner::after{
  content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;
  background:radial-gradient(circle, var(--orange) 0%, transparent 70%);
  opacity:.25;
}
.module-banner .tag{
  display:inline-flex;align-items:center;gap:8px;
  font-size:10.5px;letter-spacing:.18em;color:var(--black);font-weight:800;
  text-transform:uppercase;background:var(--orange);
  padding:6px 14px;border-radius:999px;position:relative;
}
.module-banner h2{
  margin:16px 0 6px;font-size:28px;line-height:1.1;color:var(--white);
  font-weight:800;letter-spacing:-.03em;position:relative;
}
.module-banner .desc{color:#CFCFCF;font-size:14.5px;margin:0;line-height:1.55;position:relative}

.toolbar{
  display:flex;flex-wrap:wrap;gap:10px;align-items:center;
  margin-bottom:26px;padding:12px 14px;
  background:var(--white);border-radius:16px;
}
.toolbar input[type="search"]{
  flex:1 1 220px;padding:9px 14px;border:1px solid var(--border);
  border-radius:999px;font-size:13.5px;background:var(--cream);font-family:inherit;
}
.toolbar select{
  padding:9px 14px;border:1px solid var(--border);border-radius:999px;
  font-size:13.5px;background:var(--cream);color:var(--text);font-family:inherit;
}
.toolbar .count{font-size:12px;color:var(--muted);font-weight:700;margin-left:auto}

.lesson-heading{
  display:flex;align-items:baseline;gap:10px;
  margin:36px 0 16px;padding-bottom:10px;
  border-bottom:2px solid var(--black);
}
.lesson-heading .lnum{font-size:12px;font-weight:800;color:var(--white);background:var(--black);padding:4px 10px;border-radius:999px;}
.lesson-heading h2{font-size:19px;color:var(--black)}

.cards{display:flex;flex-direction:column;gap:22px;}

.tip-card{
  background:var(--card);
  border-radius:20px;
  padding:22px 24px 24px;
  box-shadow:0 1px 0 rgba(15,15,15,.03), 0 10px 26px rgba(15,15,15,.04);
}
.tip-head{
  display:flex;align-items:flex-start;justify-content:space-between;gap:14px;
  border-bottom:2px solid var(--black);
  padding-bottom:12px;margin-bottom:16px;
}
.tip-title{font-size:19px;font-weight:800;letter-spacing:-.02em;line-height:1.25}
.tip-id{font-size:10.5px;color:var(--grey-300);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;margin-top:4px}
.tip-badges{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.badge{
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
  font-size:10.5px;letter-spacing:.12em;font-weight:800;text-transform:uppercase;
  padding:6px 13px;border-radius:999px;
}
.badge.type-error{background:var(--black);color:var(--white)}
.badge.type-error .dot{width:6px;height:6px;border-radius:99px;background:var(--orange)}
.badge.type-lifehack{background:var(--orange);color:var(--black)}
.badge.hw{background:var(--cream-2);color:var(--grey-700);text-transform:none;letter-spacing:0;font-weight:700}

.callout{
  border-radius:14px;padding:14px 16px;margin-top:12px;
  border-left:4px solid;
}
.callout .chead{
  display:flex;align-items:center;gap:8px;
  font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  margin-bottom:6px;
}
.callout .chead .mark{font-size:13px}
.callout p{margin:0;font-size:14px;line-height:1.55}

.c-error{background:var(--error-bg);border-color:var(--error-bd);color:var(--error-tx)}
.c-tip{background:var(--tip-bg);border-color:var(--tip-bd);color:var(--tip-tx)}
.c-how{background:var(--how-bg);border-color:var(--how-bd);color:var(--how-tx)}
.c-why{background:var(--why-bg);border-color:var(--why-bd);color:var(--why-tx)}
.c-ex{background:var(--ex-bg);border-color:var(--ex-bd);color:var(--ex-tx)}
.c-ex p{
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:12.6px;white-space:pre-wrap;word-break:break-word;
}

.empty-state{
  padding:50px 10px;text-align:center;color:var(--muted);
  background:var(--white);border-radius:20px;font-size:14px;font-weight:600;
}

footer.site-footer{
  max-width:1280px;margin:0 auto;padding:24px 20px 60px;
  text-align:center;color:var(--muted);font-size:12.5px;font-weight:600;
}
.brandmark{
  display:inline-flex;align-items:baseline;gap:10px;justify-content:center;
  flex-wrap:wrap;
}
.brandmark .word{
  font-size:19px;font-weight:800;letter-spacing:-.01em;color:var(--black);
  line-height:1;
}
.brandmark .tilt{
  display:inline-block;color:var(--orange-2);
  transform:skewX(-10deg);
  font-style:normal;
}
.brandmark .year{
  font-size:11.5px;font-weight:700;color:var(--muted);
  letter-spacing:.06em;
}


/* --- Ліцей №81: контентні компоненти --- */
.hero-priority{
  display:flex;align-items:flex-start;gap:16px;
  background:var(--white);border-radius:20px;padding:20px 22px;
  margin-bottom:22px;border:1px solid var(--border);
}
.hero-priority .icon{
  flex:0 0 auto;width:42px;height:42px;border-radius:13px;
  display:flex;align-items:center;justify-content:center;
  background:var(--orange);color:var(--black);font-weight:800;font-size:20px;
}
.hero-priority h3{font-size:17px;margin:0 0 4px}
.hero-priority p{margin:0;font-size:14px;color:var(--grey-700)}

.model-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.model-card{
  background:var(--white);border-radius:20px;padding:22px;
  box-shadow:0 1px 0 rgba(15,15,15,.03),0 10px 26px rgba(15,15,15,.04);
}
.model-card .model-tag{
  display:inline-flex;padding:6px 12px;border-radius:999px;
  background:var(--orange-pale);color:#8A3A0F;font-size:10.5px;
  font-weight:800;letter-spacing:.1em;text-transform:uppercase;
}
.model-card h3{font-size:19px;margin:13px 0 8px}
.model-card p{margin:0;color:var(--grey-700);font-size:14px;line-height:1.6}
.model-card ul{margin:12px 0 0;padding-left:20px;color:var(--grey-700);font-size:13.5px}

.schedule-wrap{
  background:var(--white);border-radius:20px;overflow:hidden;
  box-shadow:0 1px 0 rgba(15,15,15,.03),0 10px 26px rgba(15,15,15,.04);
}
.schedule-table{width:100%;border-collapse:collapse;font-size:13.5px}
.schedule-table th{
  background:var(--black);color:var(--white);text-align:left;
  padding:12px 15px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
}
.schedule-table td{padding:11px 15px;border-bottom:1px solid var(--cream-2);vertical-align:top}
.schedule-table tr:last-child td{border-bottom:none}
.schedule-table tr:nth-child(even) td{background:#FAF9F5}
.schedule-table .lesson{font-weight:800;white-space:nowrap}
.schedule-table .time{font-weight:700;white-space:nowrap}
.schedule-table .break{color:var(--muted)}

.days-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.day-card{
  background:var(--white);border-radius:20px;padding:20px;
  box-shadow:0 1px 0 rgba(15,15,15,.03),0 10px 26px rgba(15,15,15,.04);
}
.day-card.full{grid-column:1/-1}
.day-title{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding-bottom:11px;margin-bottom:13px;border-bottom:2px solid var(--black);
}
.day-title h3{font-size:18px}
.day-title .day-badge{
  font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;
  background:var(--orange);padding:5px 9px;border-radius:999px;
}
.shift{padding:12px 0;border-bottom:1px solid var(--cream-2)}
.shift:last-child{border-bottom:none;padding-bottom:0}
.shift:first-child{padding-top:0}
.shift .shift-time{font-size:12px;font-weight:800;color:#A35418;margin-bottom:5px}
.shift .shift-label{
  font-size:10.5px;font-weight:800;letter-spacing:.08em;
  text-transform:uppercase;color:var(--muted);margin-bottom:5px;
}
.shift .classes{font-size:14px;font-weight:700;line-height:1.6}
.shift.remote{background:var(--cream);border-radius:12px;padding:11px 12px;margin-top:10px;border-bottom:0}
.shift.remote .shift-time{color:var(--grey-700)}

.clock-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.clock-card{
  background:var(--white);border-radius:20px;padding:20px;
  box-shadow:0 1px 0 rgba(15,15,15,.03),0 10px 26px rgba(15,15,15,.04);
}
.clock-card h3{font-size:17px;margin:0 0 14px}
.clock-list{display:flex;flex-direction:column;gap:8px}
.clock-row{
  display:flex;justify-content:space-between;gap:12px;
  padding:9px 0;border-bottom:1px solid var(--cream-2);font-size:13px;
}
.clock-row:last-child{border-bottom:none}
.clock-row .label{font-weight:700}
.clock-row .time{font-weight:800;white-space:nowrap}
.clock-row.lunch{background:var(--orange-pale);border-radius:10px;padding:9px 10px;border-bottom:none}

.safety-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.safety-card{
  background:var(--white);border-radius:20px;padding:20px;
  box-shadow:0 1px 0 rgba(15,15,15,.03),0 10px 26px rgba(15,15,15,.04);
}
.safety-card .person{
  display:inline-flex;padding:6px 11px;border-radius:999px;
  background:var(--black);color:var(--white);font-size:10.5px;
  font-weight:800;letter-spacing:.08em;text-transform:uppercase;
}
.safety-card h3{font-size:17px;margin:12px 0 8px}
.safety-card p{font-size:13.5px;line-height:1.6;margin:0;color:var(--grey-700)}
.teams-card{
  margin-top:18px;background:var(--black);color:var(--white);
  border-radius:20px;padding:22px;
}
.teams-card h3{font-size:20px;margin:0 0 8px}
.teams-card p{color:#CFCFCF;font-size:14px;margin:0 0 13px}
.teams-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.teams-item{
  background:#1A1A1A;border:1px solid #303030;border-radius:13px;
  padding:12px 14px;font-size:13px;color:#E5E5E5;
}
.teams-item strong{color:var(--orange);display:block;margin-bottom:3px}

.info-note{
  margin-top:18px;padding:14px 16px;border-left:4px solid var(--orange);
  background:var(--orange-pale);border-radius:14px;color:#8A3A0F;font-size:13.5px;
}
.section-intro{font-size:14px;color:var(--grey-700);margin:0 0 18px}
.compact-list{margin:0;padding-left:20px}
.compact-list li{margin:5px 0}

@media (max-width:1000px){
  .clock-grid{grid-template-columns:1fr 1fr}
  .safety-grid{grid-template-columns:1fr 1fr}
}
@media (max-width:700px){
  .model-grid,.days-grid,.clock-grid,.safety-grid{grid-template-columns:1fr}
  .day-card.full{grid-column:auto}
  .teams-list{grid-template-columns:1fr}
  .schedule-wrap{overflow-x:auto}
  .schedule-table{min-width:650px}
  .hero-priority{padding:17px}
}

</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="topbar-bar">
      <a href="#" class="logo" onclick="return false;">
        <span class="label">Одеський ліцей №81<small>2026–2027 навчальний рік</small></span>
      </a>
      <nav class="blocks-tabs" id="blockNav" aria-label="Основна навігація"></nav>
    </div>
    <div class="mobile-progress">
      <span class="label">Прогрес</span>
      <div class="bar"><div class="fill" id="progressFillMobile" style="width:0%"></div></div>
      <span class="pct" id="progressPctMobile">0%</span>
    </div>
  </div>
</header>

<div class="shell">
  <aside class="side">
    <div class="side-title">Розділи вкладки</div>
    <div class="side-list" id="moduleNav"></div>
    <div class="progress-card">
      <div class="label"><span>Прогрес читання</span><span id="progressPct">0%</span></div>
      <div class="bar"><div class="fill" id="progressFill" style="width:0%"></div></div>
    </div>
  </aside>

  <main class="content">
    <div id="moduleBanner"></div>
    <div id="lessonsContainer"></div>
  </main>
</div>

<footer class="site-footer">
  <span class="brandmark">
    <span class="word">ОДЕСЬКИЙ <span class="tilt">ЛІЦЕЙ №81</span></span>
    <span class="year">2026–2027</span>
  </span>
</footer>

<script>
const TABS = [
  {
    id: 1,
    title: "Головна",
    shortTitle: "Головна",
    sections: ["Огляд", "Моделі навчання"]
  },
  {
    id: 2,
    title: "Модель А",
    shortTitle: "Модель А",
    sections: ["Основний розклад", "Дзвінки"]
  },
  {
    id: 3,
    title: "Модель Б · Укриття",
    shortTitle: "Модель Б · Укриття",
    sections: ["Понеділок", "Вівторок", "Середа", "Четвер", "П’ятниця", "Субота"]
  },
  {
    id: 4,
    title: "Модель Б · Дзвінки",
    shortTitle: "Модель Б · Дзвінки",
    sections: ["ІІ зміна", "Підзмінка", "Дистанційно"]
  },
  {
    id: 5,
    title: "Безпека & Teams",
    shortTitle: "Безпека & Teams",
    sections: ["Повітряна тривога", "Microsoft Teams"]
  }
];

let state = { tab: 1 };

function escapeHtml(str) {
  return (str || "").replace(/[&<>"']/g, s => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[s]));
}

function renderBlockNav() {
  const nav = document.getElementById("blockNav");
  nav.innerHTML = "";
  TABS.forEach(tab => {
    const btn = document.createElement("button");
    btn.className = tab.id === state.tab ? "on" : "";
    btn.innerHTML = '<span class="dot"></span>' + escapeHtml(tab.title);
    btn.addEventListener("click", () => {
      state.tab = tab.id;
      renderAll();
      window.scrollTo({top:0, left:0, behavior:"instant"});
      updateReadProgress();
    });
    nav.appendChild(btn);
  });
}

function renderModuleNav() {
  const nav = document.getElementById("moduleNav");
  nav.innerHTML = "";
  const tab = TABS.find(t => t.id === state.tab);
  tab.sections.forEach((section, index) => {
    const btn = document.createElement("button");
    btn.className = "side-item";
    btn.innerHTML = '<span>' + escapeHtml(section) + '</span>';
    btn.addEventListener("click", () => {
      const target = document.getElementById("section-" + index);
      if (target) target.scrollIntoView({behavior:"smooth", block:"start"});
    });
    nav.appendChild(btn);
  });
}

function updateReadProgress() {
  const scrollTop = window.scrollY || document.documentElement.scrollTop || 0;
  const scrollable = document.documentElement.scrollHeight - window.innerHeight;
  const pct = scrollable > 0 ? Math.min(100, Math.max(0, Math.round((scrollTop / scrollable) * 100))) : 100;
  const pctEl = document.getElementById("progressPct");
  const fillEl = document.getElementById("progressFill");
  if (pctEl) pctEl.textContent = pct + "%";
  if (fillEl) fillEl.style.width = pct + "%";
  const pctElMobile = document.getElementById("progressPctMobile");
  const fillElMobile = document.getElementById("progressFillMobile");
  if (pctElMobile) pctElMobile.textContent = pct + "%";
  if (fillElMobile) fillElMobile.style.width = pct + "%";
}

let progressTicking = false;
window.addEventListener("scroll", () => {
  if (!progressTicking) {
    window.requestAnimationFrame(() => {
      updateReadProgress();
      progressTicking = false;
    });
    progressTicking = true;
  }
}, {passive:true});
window.addEventListener("resize", updateReadProgress);
